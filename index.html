'<line x1="0" x2="300" y1="'+(62-20/mxd*60)+'" y2="'+(62-20/mxd*60)+'" stroke="#ffd23f" stroke-dasharray="3 3"/></svg>'+
'<div class="sub">'+T.days[0][0]+' … '+T.days[T.days.length-1][0]+' · dashed = stage-1 target 20/day · live buys from ledger</div>'+
'<div class="grid" style="margin-top:6px">'+T.stages.map(function(x,i){return chip('STAGE '+(i+1),x+'/day',i==0?'warn':'off')}).join('')+'</div>'));
var B=D.board;h.push(card('STRATEGY LEADERBOARD','net SOL/trade, realistic',
'<table><tr><th>STRATEGY</th><th></th><th>N</th><th>EV</th><th>STRESS</th></tr>'+B.rows.map(function(r){return '<tr><td>'+e(r.name)+'</td><td><span class="tag '+r.kind+'">'+r.kind+'</span></td><td class="n">'+e(r.n)+'</td><td class="n '+(r.per>0?'on':'bad')+'">'+f(r.per,4)+'</td><td class="n '+(r.stress>0?'on':'bad')+'">'+f(r.stress,4)+'</td></tr>'}).join('')+'</table>'+
'<div class="sub" style="margin-top:6px">Judge: '+e(B.judge||'—')+'</div><div class="sub">source: Champions re-cost · '+e(B.src_age_min)+' min old</div>'));
var R=D.review;h.push(card('REVIEW & GO','per package',
'<table><tr><th>HASH</th><th>VERDICT</th><th>PACKAGE</th><th>AT</th></tr>'+R.reviews.map(function(r){return '<tr><td>'+e(r.hash)+'</td><td class="'+(r.verdict=='PASS'?'on':'bad')+'">'+e(r.verdict)+'</td><td>'+e(r.pkg)+'</td><td>'+e(r.at)+'</td></tr>'}).join('')+'</table>'+
(R.in_review.length?'<div class="sub" style="margin-top:4px">staged: '+R.in_review.map(e).join(', ')+'</div>':'')+
'<div class="sub" style="margin:8px 0 3px">GO log</div><table>'+R.go.map(function(g){return '<tr><td>'+e(g.t)+'</td><td>'+e(g.ticket)+'</td><td>'+e(g.action)+'</td></tr>'}).join('')+'</table>'));
h.push(card('BOT TEAM','last file activity',D.team.map(function(b){var c=b.last_min==null?'':b.last_min<30?'g':b.last_min<240?'y':'r';
return '<div style="padding:5px 0;border-bottom:1px solid #141a33"><span class="dot '+c+'"></span><b>'+e(b.name)+'</b> <span class="sub">· '+(b.last_min==null?'—':b.last_min<120?b.last_min+' min ago':Math.round(b.last_min/60)+' h ago')+'</span><div class="sub">'+e(b.role)+'</div></div>'}).join('')+'<div class="sub" style="margin-top:4px">current task: not exposed in a public-safe form</div>'));
var H=D.health;h.push(card('DATA SOURCES','',
'<div class="grid">'+chip('SCAN',e(H.scan),H.scan=='up'?'on':'bad')+chip('ENDPOINTS',e(H.endpoints_ok)+' ok / '+e(H.endpoints_failed)+' fail',H.endpoints_failed>H.endpoints_ok?'bad':'warn')+
chip('DEX_SEARCH FAIL',e(H.dex_failed),H.dex_failed>10?'bad':'on')+chip('UNIVERSE',e(H.latest_n)+'<div class="sub">'+e(H.latest_age_min)+' min old</div>')+
chip('HELIUS TODAY',e(H.helius_calls)+' calls')+chip('JUPITER',e(H.jup_budget)+'/min<div class="sub">'+e(H.jup_denies)+' denies</div>')+chip('429s IN LOG',e(H.log_429),H.log_429>20?'warn':'on')+'</div>'+
'<table style="margin-top:6px"><tr><th>RPC</th><th>STATE</th><th>429 TOTAL</th></tr>'+H.rpc.map(function(p){return '<tr><td>'+e(p.name)+'</td><td class="'+(p.up?'on':'bad')+'">'+(p.up?'up':'down · '+e(p.reason))+'</td><td class="n">'+e(p.n429)+'</td></tr>'}).join('')+'</table>'));
document.getElementById('app').innerHTML=h.join('')}
render(D);
setInterval(function(){fetch('data.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(render).catch(function(){})},60000);
</script></body></html>
